[project]
name = "cross-stitching-pattern-maker"
version = "0.1.0"
description = "Turn an image into a printable cross-stitch pattern with real thread colours"
readme = "README.md"
authors = [{ name = "Eliot Christon", email = "eliot.christon@gmail.com" }]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.mypy]
strict = true

[tool.pylint.main]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["missing-module-docstring", "missing-function-docstring", "missing-class-docstring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
